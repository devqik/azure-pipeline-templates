# Template: java-build-job.yml
# Description: Standard Java build job with Maven/Gradle support
# Parameters:
# - buildTool: Build tool to use ('maven' or 'gradle', default: 'maven')
# - buildConfiguration: Build configuration ('debug' or 'release', default: 'release')
# - projectPath: Path to pom.xml (Maven) or build.gradle / build.gradle.kts (Gradle) (default: 'pom.xml')
# - vmImage: Microsoft-hosted VM image (default: 'ubuntu-latest'). Ignored when poolName is set
# - poolName: Self-hosted agent pool name (default: ''). When set, takes precedence over vmImage
# - demands: Agent demands for the self-hosted pool (default: [])
# - artifactName: Name for published artifacts (default: 'java-artifacts')
# - javaVersion: Java version to use (default: '11')
# - skipTests: Whether to skip tests (default: false)
# - publishTestResults: Whether to publish test results (default: true)

parameters:
- name: buildTool
  type: string
  default: 'maven'
  values: ['maven', 'gradle']
- name: buildConfiguration
  type: string
  default: 'release'
  values: ['debug', 'release']
- name: projectPath
  type: string
  default: 'pom.xml'
- name: vmImage
  type: string
  default: 'ubuntu-latest'
- name: poolName
  type: string
  default: ''
- name: demands
  type: object
  default: []
- name: artifactName
  type: string
  default: 'java-artifacts'
- name: javaVersion
  type: string
  default: '11'
- name: skipTests
  type: boolean
  default: false
- name: publishTestResults
  type: boolean
  default: true

jobs:
- job: JavaBuild
  displayName: 'Java Build'
  ${{ if ne(parameters.poolName, '') }}:
    pool:
      name: ${{ parameters.poolName }}
      ${{ if gt(length(parameters.demands), 0) }}:
        demands: ${{ parameters.demands }}
  ${{ if eq(parameters.poolName, '') }}:
    pool:
      vmImage: ${{ parameters.vmImage }}

  steps:
  - template: steps/setup-java.yml@templates
    parameters:
      javaVersion: ${{ parameters.javaVersion }}

  - template: steps/java-build-steps.yml@templates
    parameters:
      buildTool: ${{ parameters.buildTool }}
      buildConfiguration: ${{ parameters.buildConfiguration }}
      projectPath: ${{ parameters.projectPath }}
      skipTests: ${{ parameters.skipTests }}
      publishTestResults: ${{ parameters.publishTestResults }}

  - task: CopyFiles@2
    displayName: 'Stage build output'
    inputs:
      SourceFolder: '$(System.DefaultWorkingDirectory)'
      ${{ if eq(parameters.buildTool, 'maven') }}:
        Contents: '**/target/*.jar'
      ${{ if eq(parameters.buildTool, 'gradle') }}:
        Contents: '**/build/libs/*.jar'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      flattenFolders: true

  - template: steps/publish-artifacts.yml@templates
    parameters:
      artifactName: ${{ parameters.artifactName }}
      publishPath: '$(Build.ArtifactStagingDirectory)'
