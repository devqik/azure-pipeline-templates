# Template: nuget-lint-job.yml
# Description: .NET lint job running dotnet format
# Parameters:
# - dotnetVersion: .NET SDK version to use (default: '8.0.x')
# - projectPath: Path to .NET project or solution (default: '.')
# - projects: Glob for solution or project files (default: '**/*.sln')
# - vmImage: Microsoft-hosted VM image (default: 'ubuntu-latest'). Ignored when poolName is set
# - poolName: Self-hosted agent pool name (default: ''). When set, takes precedence over vmImage
# - demands: Agent demands for the self-hosted pool (default: [])
# - severity: Minimum severity to report (default: 'warn')
# - continueOnError: whether to continue on lint errors (default: false)

parameters:
- name: dotnetVersion
  type: string
  default: '8.0.x'
- name: projectPath
  type: string
  default: '.'
- name: projects
  type: string
  default: '**/*.sln'
- name: vmImage
  type: string
  default: 'ubuntu-latest'
- name: poolName
  type: string
  default: ''
- name: demands
  type: object
  default: []
- name: severity
  type: string
  default: 'warn'
  values: ['info', 'warn', 'error']
- name: continueOnError
  type: boolean
  default: false

jobs:
- job: NuGetLint
  displayName: 'NuGet Lint'
  ${{ if ne(parameters.poolName, '') }}:
    pool:
      name: ${{ parameters.poolName }}
      ${{ if gt(length(parameters.demands), 0) }}:
        demands: ${{ parameters.demands }}
  ${{ if eq(parameters.poolName, '') }}:
    pool:
      vmImage: ${{ parameters.vmImage }}

  steps:
  - template: steps/setup-dotnet.yml@templates
    parameters:
      dotnetVersion: ${{ parameters.dotnetVersion }}

  - template: steps/nuget-lint-steps.yml@templates
    parameters:
      projectPath: ${{ parameters.projectPath }}
      projects: ${{ parameters.projects }}
      severity: ${{ parameters.severity }}
      continueOnError: ${{ parameters.continueOnError }}
