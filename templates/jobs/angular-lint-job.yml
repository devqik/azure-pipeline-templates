# Template: angular-lint-job.yml
# Description: Angular lint job running ESLint via npm script
# Parameters:
# - nodeVersion: Node.js version to use (default: '18')
# - projectPath: Path to Angular project (default: '.')
# - vmImage: Microsoft-hosted VM image (default: 'ubuntu-latest'). Ignored when poolName is set
# - poolName: Self-hosted agent pool name (default: ''). When set, takes precedence over vmImage
# - demands: Agent demands for the self-hosted pool (default: [])
# - lintScript: npm script to run for linting (default: 'lint')
# - continueOnError: whether to continue on lint errors (default: false)

parameters:
- name: nodeVersion
  type: string
  default: '18'
- name: projectPath
  type: string
  default: '.'
- name: vmImage
  type: string
  default: 'ubuntu-latest'
- name: poolName
  type: string
  default: ''
- name: demands
  type: object
  default: []
- name: lintScript
  type: string
  default: 'lint'
- name: continueOnError
  type: boolean
  default: false

jobs:
- job: AngularLint
  displayName: 'Angular Lint'
  ${{ if ne(parameters.poolName, '') }}:
    pool:
      name: ${{ parameters.poolName }}
      ${{ if gt(length(parameters.demands), 0) }}:
        demands: ${{ parameters.demands }}
  ${{ if eq(parameters.poolName, '') }}:
    pool:
      vmImage: ${{ parameters.vmImage }}

  steps:
  - template: steps/setup-nodejs.yml@templates
    parameters:
      nodeVersion: ${{ parameters.nodeVersion }}

  - template: steps/angular-lint-steps.yml@templates
    parameters:
      projectPath: ${{ parameters.projectPath }}
      lintScript: ${{ parameters.lintScript }}
      continueOnError: ${{ parameters.continueOnError }}

