# Template: java-test-job.yml
# Description: Java unit and integration testing job
# Parameters:
# - buildTool: Build tool to use ('maven' or 'gradle', default: 'maven')
# - projectPath: Path to pom.xml (Maven) or build.gradle / build.gradle.kts (Gradle) (default: 'pom.xml')
# - vmImage: Microsoft-hosted VM image (default: 'ubuntu-latest'). Ignored when poolName is set
# - poolName: Self-hosted agent pool name (default: ''). When set, takes precedence over vmImage
# - demands: Agent demands for the self-hosted pool (default: [])
# - javaVersion: Java version to use (default: '11')
# - testType: Type of tests to run ('unit', 'integration', 'all', default: 'all')
# - coverageThreshold: Minimum code coverage percentage (default: 80)
# - parallelTests: Whether to run tests in parallel (default: true)

parameters:
- name: buildTool
  type: string
  default: 'maven'
  values: ['maven', 'gradle']
- name: projectPath
  type: string
  default: 'pom.xml'
- name: vmImage
  type: string
  default: 'ubuntu-latest'
- name: poolName
  type: string
  default: ''
- name: demands
  type: object
  default: []
- name: javaVersion
  type: string
  default: '11'
- name: testType
  type: string
  default: 'all'
  values: ['unit', 'integration', 'all']
- name: coverageThreshold
  type: number
  default: 80
- name: parallelTests
  type: boolean
  default: true

jobs:
- job: JavaTest
  displayName: 'Java Tests'
  ${{ if ne(parameters.poolName, '') }}:
    pool:
      name: ${{ parameters.poolName }}
      ${{ if gt(length(parameters.demands), 0) }}:
        demands: ${{ parameters.demands }}
  ${{ if eq(parameters.poolName, '') }}:
    pool:
      vmImage: ${{ parameters.vmImage }}

  steps:
  - template: steps/setup-java.yml@templates
    parameters:
      javaVersion: ${{ parameters.javaVersion }}

  - template: steps/java-test-steps.yml@templates
    parameters:
      buildTool: ${{ parameters.buildTool }}
      projectPath: ${{ parameters.projectPath }}
      testType: ${{ parameters.testType }}
      coverageThreshold: ${{ parameters.coverageThreshold }}
      parallelTests: ${{ parameters.parallelTests }}
