# Template: angular-build-steps.yml
# Description: Angular build steps for building Angular applications
# Parameters:
# - buildConfiguration: Build configuration ('development', 'staging', 'production')
# - projectPath: Path to Angular project
# - buildOptimization: Whether to enable build optimization
# - sourceMap: Whether to generate source maps
# - cacheDependencies: Whether to cache node_modules

parameters:
- name: buildConfiguration
  type: string
- name: projectPath
  type: string
- name: buildOptimization
  type: boolean
- name: sourceMap
  type: boolean
- name: cacheDependencies
  type: boolean

steps:
- ${{ if parameters.cacheDependencies }}:
  - task: Cache@2
    displayName: 'Cache node_modules'
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: '$(projectPath)/node_modules'

- script: |
    cd $(projectPath)
    npm ci
  displayName: 'Install dependencies'

- script: |
    cd $(projectPath)
    OPT_FLAG="--no-optimization"
    MAP_FLAG="--no-source-map"
    case "$(buildOptimization)" in
      True|true) OPT_FLAG="--optimization" ;;
    esac
    case "$(sourceMap)" in
      True|true) MAP_FLAG="--source-map" ;;
    esac
    npm run build -- --configuration=$(buildConfiguration) $OPT_FLAG $MAP_FLAG
  displayName: 'Build Angular application'

- script: |
    cd $(projectPath)
    echo "Build completed successfully"
    echo "Build artifacts location: dist/"
    ls -la dist/
  displayName: 'Verify build artifacts'
