# Template: java-test-steps.yml
# Description: Java test steps for Maven and Gradle projects
# Uses the JDK selected by setup-java.yml (JAVA_HOME).
# Project requirements:
# - Unit tests named *Test; integration tests named *IT (Maven: run by maven-failsafe-plugin)
# - Gradle: an 'integrationTest' task for integration tests
# - JaCoCo configured to produce XML reports for coverage
# Parameters:
# - buildTool: Build tool to use ('maven' or 'gradle')
# - projectPath: Path to pom.xml (Maven) or build.gradle / build.gradle.kts (Gradle)
# - testType: Type of tests to run ('unit', 'integration', 'all')
# - coverageThreshold: Minimum code coverage percentage
# - parallelTests: Whether to run tests in parallel

parameters:
- name: buildTool
  type: string
- name: projectPath
  type: string
- name: testType
  type: string
- name: coverageThreshold
  type: number
- name: parallelTests
  type: boolean

steps:
- ${{ if eq(parameters.buildTool, 'maven') }}:
  - ${{ if or(eq(parameters.testType, 'unit'), eq(parameters.testType, 'all')) }}:
    - task: Maven@3
      displayName: 'Maven Unit Tests'
      inputs:
        mavenPomFile: '${{ parameters.projectPath }}'
        goals: 'test'
        options: '-Dsurefire.failIfNoSpecifiedTests=false'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'Path'
        jdkDirectory: '$(JAVA_HOME)'
        mavenVersionOption: 'Default'

  - ${{ if or(eq(parameters.testType, 'integration'), eq(parameters.testType, 'all')) }}:
    - task: Maven@3
      displayName: 'Maven Integration Tests'
      inputs:
        mavenPomFile: '${{ parameters.projectPath }}'
        goals: 'verify'
        options: '-Dtest=NONE -Dsurefire.failIfNoSpecifiedTests=false'
        publishJUnitResults: true
        testResultsFiles: '**/failsafe-reports/TEST-*.xml'
        javaHomeOption: 'Path'
        jdkDirectory: '$(JAVA_HOME)'
        mavenVersionOption: 'Default'

  - task: PublishCodeCoverageResults@1
    displayName: 'Publish Code Coverage'
    condition: succeededOrFailed()
    inputs:
      codeCoverageTool: 'JaCoCo'
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/target/site/jacoco/jacoco.xml'

- ${{ if eq(parameters.buildTool, 'gradle') }}:
  - ${{ if or(eq(parameters.testType, 'unit'), eq(parameters.testType, 'all')) }}:
    - task: Gradle@2
      displayName: 'Gradle Unit Tests'
      inputs:
        workingDirectory: ${{ replace(replace(parameters.projectPath, 'build.gradle.kts', ''), 'build.gradle', '') }}
        gradleWrapperFile: ${{ format('{0}gradlew', replace(replace(parameters.projectPath, 'build.gradle.kts', ''), 'build.gradle', '')) }}
        gradleOptions: '-Xmx3072m'
        javaHomeOption: 'Path'
        jdkDirectory: '$(JAVA_HOME)'
        tasks: 'test jacocoTestReport'
        ${{ if parameters.parallelTests }}:
          options: '--parallel'
        publishJUnitResults: true
        testResultsFiles: '**/build/test-results/test/TEST-*.xml'

  - ${{ if or(eq(parameters.testType, 'integration'), eq(parameters.testType, 'all')) }}:
    - task: Gradle@2
      displayName: 'Gradle Integration Tests'
      inputs:
        workingDirectory: ${{ replace(replace(parameters.projectPath, 'build.gradle.kts', ''), 'build.gradle', '') }}
        gradleWrapperFile: ${{ format('{0}gradlew', replace(replace(parameters.projectPath, 'build.gradle.kts', ''), 'build.gradle', '')) }}
        gradleOptions: '-Xmx3072m'
        javaHomeOption: 'Path'
        jdkDirectory: '$(JAVA_HOME)'
        tasks: 'integrationTest'
        ${{ if parameters.parallelTests }}:
          options: '--parallel'
        publishJUnitResults: true
        testResultsFiles: '**/build/test-results/integrationTest/TEST-*.xml'

  - task: PublishCodeCoverageResults@1
    displayName: 'Publish Code Coverage'
    condition: succeededOrFailed()
    inputs:
      codeCoverageTool: 'JaCoCo'
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/build/reports/jacoco/test/jacocoTestReport.xml'

- bash: |
    THRESHOLD=${{ parameters.coverageThreshold }}
    FILES=$(find . \( -name 'jacoco.xml' -o -name 'jacocoTestReport.xml' \) 2>/dev/null)
    if [ -z "$FILES" ]; then
      echo "##vso[task.logissue type=warning]No JaCoCo XML report found; skipping coverage threshold check."
      exit 0
    fi
    COVERED=0; MISSED=0
    for f in $FILES; do
      line=$(grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"/>' "$f" | tail -n 1)
      m=$(echo "$line" | sed -E 's/.*missed="([0-9]+)".*/\1/')
      c=$(echo "$line" | sed -E 's/.*covered="([0-9]+)".*/\1/')
      MISSED=$((MISSED + ${m:-0})); COVERED=$((COVERED + ${c:-0}))
    done
    awk -v c="$COVERED" -v m="$MISSED" -v t="$THRESHOLD" 'BEGIN {
      total = c + m
      pct = (total > 0) ? c * 100 / total : 0
      printf "Line coverage: %.2f%% (threshold %s%%)\n", pct, t
      exit (pct >= t + 0) ? 0 : 1
    }' || { echo "##vso[task.logissue type=error]Line coverage is below ${THRESHOLD}%"; exit 1; }
  displayName: 'Check coverage threshold'
