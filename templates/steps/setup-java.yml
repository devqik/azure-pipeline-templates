# Template: setup-java.yml
# Description: Setup Java environment with specified version
# Parameters:
# - javaVersion: Java version to install (default: '11'). Must be pre-installed on the agent

parameters:
- name: javaVersion
  type: string
  default: '11'

steps:
- task: JavaToolInstaller@0
  displayName: 'Setup Java ${{ parameters.javaVersion }}'
  inputs:
    versionSpec: '${{ parameters.javaVersion }}'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- script: |
    echo "Java version:"
    java -version
    echo "JAVA_HOME: $JAVA_HOME"
    if command -v mvn >/dev/null 2>&1; then mvn -version; fi
  displayName: 'Verify Java installation'
