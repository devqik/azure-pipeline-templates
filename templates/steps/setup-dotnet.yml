# Template: setup-dotnet.yml
# Description: Setup .NET SDK environment with specified version
# Parameters:
# - dotnetVersion: .NET SDK version to install (default: '8.0.x'). Set to '' to use the SDK already on the agent
#   (UseDotNet downloads from Microsoft, which fails on offline agents)
# - includePreviewVersions: Whether to include preview SDK versions (default: false)

parameters:
- name: dotnetVersion
  type: string
  default: '8.0.x'
- name: includePreviewVersions
  type: boolean
  default: false

steps:
- ${{ if ne(parameters.dotnetVersion, '') }}:
  - task: UseDotNet@2
    displayName: 'Setup .NET SDK ${{ parameters.dotnetVersion }}'
    inputs:
      packageType: 'sdk'
      version: '${{ parameters.dotnetVersion }}'
      includePreviewVersions: ${{ parameters.includePreviewVersions }}

- script: |
    echo ".NET SDK version:"
    dotnet --version
    echo "Installed SDKs:"
    dotnet --list-sdks
    echo "Installed runtimes:"
    dotnet --list-runtimes
  displayName: 'Verify .NET SDK installation'
