# Template: nuget-push-steps.yml
# Description: Push packed .nupkg files to a NuGet feed
# Parameters:
# - packagesToPush: Path glob for packages to push
# - nuGetFeedType: Feed type ('internal' for an Azure Artifacts feed, 'external' for nuget.org or another server)
# - publishVstsFeed: Azure Artifacts feed, 'Feed' or 'Project/Feed' (required when nuGetFeedType is 'internal')
# - publishFeedCredentials: NuGet service connection (required when nuGetFeedType is 'external')

parameters:
- name: packagesToPush
  type: string
  default: '$(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg'
- name: nuGetFeedType
  type: string
  default: 'internal'
  values: ['internal', 'external']
- name: publishVstsFeed
  type: string
  default: ''
- name: publishFeedCredentials
  type: string
  default: ''

steps:
- task: DotNetCoreCLI@2
  displayName: 'Push NuGet packages'
  inputs:
    command: 'push'
    packagesToPush: '${{ parameters.packagesToPush }}'
    nuGetFeedType: '${{ parameters.nuGetFeedType }}'
    ${{ if eq(parameters.nuGetFeedType, 'internal') }}:
      publishVstsFeed: '${{ parameters.publishVstsFeed }}'
    ${{ if eq(parameters.nuGetFeedType, 'external') }}:
      publishFeedCredentials: '${{ parameters.publishFeedCredentials }}'
