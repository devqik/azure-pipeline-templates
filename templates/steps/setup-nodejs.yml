# Template: setup-nodejs.yml
# Description: Setup Node.js environment with specified version
# Parameters:
# - nodeVersion: Node.js version to install (default: '18'). Set to '' to use the Node.js already on the agent
#   (NodeTool downloads from nodejs.org, which fails on offline agents)

parameters:
- name: nodeVersion
  type: string
  default: '18'

steps:
- ${{ if ne(parameters.nodeVersion, '') }}:
  - task: NodeTool@0
    displayName: 'Setup Node.js ${{ parameters.nodeVersion }}'
    inputs:
      versionSpec: '${{ parameters.nodeVersion }}'

- script: |
    echo "Node.js version:"
    node --version
    echo "npm version:"
    npm --version
  displayName: 'Verify Node.js and npm installation'
