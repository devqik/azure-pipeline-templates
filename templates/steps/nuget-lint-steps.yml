# Template: nuget-lint-steps.yml
# Description: .NET lint steps using dotnet format (code style / analyzers)
# Parameters:
# - projectPath: Path to .NET project or solution
# - projects: Glob for solution or project files, relative to projectPath (e.g. '**/*.sln')
# - continueOnError: whether to continue on lint errors (default: false)
# - severity: Minimum severity to report ('info', 'warn', 'error')

parameters:
- name: projectPath
  type: string
- name: projects
  type: string
  default: '**/*.sln'
- name: continueOnError
  type: boolean
  default: false
- name: severity
  type: string
  default: 'warn'

steps:
- task: DotNetCoreCLI@2
  displayName: 'Restore dependencies'
  inputs:
    command: 'restore'
    projects: '${{ parameters.projects }}'
    workingDirectory: '${{ parameters.projectPath }}'

- bash: |
    set -u
    shopt -s globstar nullglob
    cd "${{ parameters.projectPath }}"
    targets=( ${{ parameters.projects }} )
    if [ ${#targets[@]} -eq 0 ]; then
      echo "##vso[task.logissue type=error]No files match '${{ parameters.projects }}' under '${{ parameters.projectPath }}'"
      exit 1
    fi
    mkdir -p reports
    status=0
    for target in "${targets[@]}"; do
      echo "Checking formatting: $target"
      report="reports/$(basename "$target")"
      mkdir -p "$report"
      dotnet format "$target" --verify-no-changes --no-restore --severity ${{ parameters.severity }} --report "$report" || status=1
    done
    exit $status
  displayName: 'Run dotnet format'
  continueOnError: ${{ parameters.continueOnError }}

- bash: |
    if [ -n "$(ls -A "${{ parameters.projectPath }}/reports" 2>/dev/null)" ]; then
      echo "##vso[task.setvariable variable=hasLintReports]true"
    fi
  displayName: 'Check for lint reports'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  displayName: 'Publish lint reports'
  condition: and(succeededOrFailed(), eq(variables['hasLintReports'], 'true'))
  inputs:
    PathtoPublish: '${{ parameters.projectPath }}/reports'
    ArtifactName: 'lint-reports'
    publishLocation: 'Container'
