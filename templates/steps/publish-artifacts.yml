# Template: publish-artifacts.yml
# Description: Publish build artifacts
# Parameters:
# - artifactName: Name for the published artifacts
# - publishPath: File or folder to publish (wildcards are not supported by PublishBuildArtifacts)

parameters:
- name: artifactName
  type: string
- name: publishPath
  type: string

steps:
- task: PublishBuildArtifacts@1
  displayName: 'Publish ${{ parameters.artifactName }}'
  inputs:
    pathToPublish: '${{ parameters.publishPath }}'
    artifactName: '${{ parameters.artifactName }}'
    artifactType: 'Container'
