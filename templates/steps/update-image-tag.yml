# Template: update-image-tag.yml
# Description: Updates image tag in Helm values.yaml and pushes to the specified branch
# Parameters:
# - devopsSshBase: Base SSH URL to Azure DevOps host (default: 'ssh://devops.example.com:22/')
# - organizationName: Org/collection name (default: 'DefaultCollection')
# - projectName: Azure DevOps project name (default: 'YourProject')
# - repoName: Repository name (default: 'YourRepository')
# - helmRepoName: Local folder to clone the Helm repo into (default: 'YourProject')
# - valuesFilePath: Path to values.yaml, relative to the Helm repo root, relative to the agent working directory, or absolute
# - helmBranchName: Branch to check out and push changes to (default: 'master')
# - tag: New image tag value

parameters:
- name: devopsSshBase
  type: string
  default: 'ssh://devops.example.com:22/'
- name: organizationName
  type: string
  default: 'DefaultCollection'
- name: projectName
  type: string
  default: 'YourProject'
- name: repoName
  type: string
  default: 'YourRepository'
- name: helmRepoName
  type: string
  default: 'YourProject'
- name: valuesFilePath
  type: string
- name: helmBranchName
  type: string
  default: 'master'
- name: tag
  type: string

steps:
- bash: |
    set -euo pipefail
    rm -rf "${{ parameters.helmRepoName }}"
    git clone --branch "${{ parameters.helmBranchName }}" \
      "${{ parameters.devopsSshBase }}${{ parameters.organizationName }}/${{ parameters.projectName }}/_git/${{ parameters.repoName }}" \
      "${{ parameters.helmRepoName }}"

    VALUES_FILE="${{ parameters.valuesFilePath }}"
    if [ -f "${{ parameters.helmRepoName }}/$VALUES_FILE" ]; then
      VALUES_FILE="$(pwd)/${{ parameters.helmRepoName }}/$VALUES_FILE"
    elif [ -f "$VALUES_FILE" ]; then
      VALUES_FILE="$(cd "$(dirname "$VALUES_FILE")" && pwd)/$(basename "$VALUES_FILE")"
    else
      echo "##vso[task.logissue type=error]values file not found: ${{ parameters.valuesFilePath }}"
      exit 1
    fi
    cd "${{ parameters.helmRepoName }}"

    sed -i 's|^  tag:.*|  tag: "${{ parameters.tag }}"|' "$VALUES_FILE"

    git config user.email >/dev/null || git config user.email "azure-pipelines@$(hostname)"
    git config user.name >/dev/null || git config user.name "Azure Pipelines"

    git add "$VALUES_FILE"
    if git diff --cached --quiet; then
      echo "Image tag is already ${{ parameters.tag }}; nothing to commit."
      exit 0
    fi
    git commit -m "Update image tag to ${{ parameters.tag }}"
    git push origin "HEAD:${{ parameters.helmBranchName }}"
  displayName: 'Update image tag in values.yaml'
