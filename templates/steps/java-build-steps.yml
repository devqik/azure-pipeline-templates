# Template: java-build-steps.yml
# Description: Java build steps for Maven and Gradle projects
# Uses the JDK selected by setup-java.yml (JAVA_HOME).
# Parameters:
# - buildTool: Build tool to use ('maven' or 'gradle')
# - buildConfiguration: Build configuration ('debug' or 'release')
# - projectPath: Path to pom.xml (Maven) or build.gradle / build.gradle.kts (Gradle)
# - skipTests: Whether to skip tests
# - publishTestResults: Whether to publish test results

parameters:
- name: buildTool
  type: string
- name: buildConfiguration
  type: string
- name: projectPath
  type: string
- name: skipTests
  type: boolean
- name: publishTestResults
  type: boolean

steps:
- ${{ if eq(parameters.buildTool, 'maven') }}:
  - task: Maven@3
    displayName: 'Maven Package'
    inputs:
      mavenPomFile: '${{ parameters.projectPath }}'
      goals: 'clean package'
      ${{ if parameters.skipTests }}:
        options: '-DskipTests'
      publishJUnitResults: ${{ parameters.publishTestResults }}
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      javaHomeOption: 'Path'
      jdkDirectory: '$(JAVA_HOME)'
      mavenVersionOption: 'Default'

- ${{ if eq(parameters.buildTool, 'gradle') }}:
  - task: Gradle@2
    displayName: 'Gradle Build'
    inputs:
      workingDirectory: ${{ replace(replace(parameters.projectPath, 'build.gradle.kts', ''), 'build.gradle', '') }}
      gradleWrapperFile: ${{ format('{0}gradlew', replace(replace(parameters.projectPath, 'build.gradle.kts', ''), 'build.gradle', '')) }}
      gradleOptions: '-Xmx3072m'
      javaHomeOption: 'Path'
      jdkDirectory: '$(JAVA_HOME)'
      tasks: 'build'
      ${{ if parameters.skipTests }}:
        options: '-x test'
      publishJUnitResults: ${{ parameters.publishTestResults }}
      testResultsFiles: '**/build/test-results/test/TEST-*.xml'
