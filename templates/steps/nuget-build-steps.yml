# Template: nuget-build-steps.yml
# Description: .NET build and pack steps for NuGet packages
# Parameters:
# - buildConfiguration: Build configuration ('Debug' or 'Release')
# - projectPath: Path to .NET project or solution
# - projects: Glob for solution or project files
# - cacheDependencies: Whether to cache NuGet packages (requires pipeline caching on the server)
# - packPackages: Whether to pack NuGet packages (.nupkg)
# - packagesToPack: Projects to pack; ';'-separated globs, '!' excludes (default excludes *Test* projects)
# - packageVersion: Version to apply when packing (default: '' uses the version in the project file)
# - includeSymbols: Whether to include symbol packages

parameters:
- name: buildConfiguration
  type: string
- name: projectPath
  type: string
- name: projects
  type: string
  default: '**/*.sln'
- name: cacheDependencies
  type: boolean
- name: packPackages
  type: boolean
  default: true
- name: packagesToPack
  type: string
  default: '**/*.csproj;!**/*Test*.csproj'
- name: packageVersion
  type: string
  default: ''
- name: includeSymbols
  type: boolean
  default: false

steps:
- ${{ if parameters.cacheDependencies }}:
  - task: Cache@2
    displayName: 'Cache NuGet packages'
    inputs:
      key: 'nuget | "$(Agent.OS)" | **/*.csproj'
      restoreKeys: |
        nuget | "$(Agent.OS)"
      path: '$(Pipeline.Workspace)/.nuget/packages'
  - script: echo "##vso[task.setvariable variable=NUGET_PACKAGES]$(Pipeline.Workspace)/.nuget/packages"
    displayName: 'Set NUGET_PACKAGES cache path'

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: '${{ parameters.projects }}'
    workingDirectory: '${{ parameters.projectPath }}'

- task: DotNetCoreCLI@2
  displayName: 'Build .NET project'
  inputs:
    command: 'build'
    projects: '${{ parameters.projects }}'
    workingDirectory: '${{ parameters.projectPath }}'
    arguments: '--configuration ${{ parameters.buildConfiguration }} --no-restore'

- ${{ if parameters.packPackages }}:
  - task: DotNetCoreCLI@2
    displayName: 'Pack NuGet packages'
    ${{ if ne(parameters.packageVersion, '') }}:
      env:
        PACKAGE_VERSION: '${{ parameters.packageVersion }}'
    inputs:
      command: 'pack'
      packagesToPack: '${{ parameters.packagesToPack }}'
      configurationToPack: '${{ parameters.buildConfiguration }}'
      nobuild: true
      outputDir: '$(Build.ArtifactStagingDirectory)'
      includesymbols: ${{ parameters.includeSymbols }}
      includesource: ${{ parameters.includeSymbols }}
      ${{ if eq(parameters.packageVersion, '') }}:
        versioningScheme: 'off'
      ${{ if ne(parameters.packageVersion, '') }}:
        versioningScheme: 'byEnvVar'
        versionEnvVar: 'PACKAGE_VERSION'

  - bash: |
      shopt -s nullglob
      pkgs=( "$(Build.ArtifactStagingDirectory)"/*.nupkg )
      if [ ${#pkgs[@]} -eq 0 ]; then
        echo "##vso[task.logissue type=error]No .nupkg files were produced. Check packagesToPack and <IsPackable> in your projects."
        exit 1
      fi
      printf 'Packed: %s\n' "${pkgs[@]}"
    displayName: 'Verify packages'
