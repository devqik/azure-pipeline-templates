# Template: docker-push.yml
# Description: Pushes a Docker image to a registry
# Parameters:
# - imageRepository: Docker repository name
# - tag: Image tag to push

parameters:
- name: imageRepository
  type: string
- name: tag
  type: string

steps:
- task: Docker@2
  displayName: 'Push Docker Image'
  inputs:
    repository: ${{ parameters.imageRepository }}
    command: push
    tags: |
      ${{ parameters.tag }}
