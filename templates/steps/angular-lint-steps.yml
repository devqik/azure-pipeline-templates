# Template: angular-lint-steps.yml
# Description: Angular lint steps for running ESLint or Angular CLI lint
# Parameters:
# - projectPath: Path to Angular project
# - lintScript: npm script to run for linting (default: 'lint')
# - continueOnError: whether to continue on lint errors (default: false)

parameters:
- name: projectPath
  type: string
- name: lintScript
  type: string
  default: 'lint'
- name: continueOnError
  type: boolean
  default: false

steps:
- script: |
    cd "${{ parameters.projectPath }}"
    npm ci
  displayName: 'Install dependencies'

- script: |
    cd "${{ parameters.projectPath }}"
    npm run ${{ parameters.lintScript }}
  displayName: 'Run lint'
  continueOnError: ${{ parameters.continueOnError }}

- script: |
    if [ -d "${{ parameters.projectPath }}/reports" ]; then
      echo "##vso[task.setvariable variable=hasLintReports]true"
    fi
  displayName: 'Check for lint reports'
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  displayName: 'Publish lint reports'
  condition: and(succeededOrFailed(), eq(variables['hasLintReports'], 'true'))
  inputs:
    PathtoPublish: '${{ parameters.projectPath }}/reports'
    ArtifactName: 'lint-reports'
    publishLocation: 'Container'
